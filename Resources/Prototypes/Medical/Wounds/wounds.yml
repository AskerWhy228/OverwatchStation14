      name: wound-fracture-stage-1
    - threshold: 30
      name: wound-fracture-stage-2
  selfHealBelow: 0
  selfHealRate: 0.0
  treatableBy: [ ]
  bleedFactor: 0.0

- type: wound
  id: InternalBleeding
  name: wound-internal-bleeding
